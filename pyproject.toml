[project]
name = "oabench"
version = "0.1.0"
description = "Benchmark of dataset-search approaches (lexical, embeddings, graph, agent) on an open-data catalog, with a read-only MCP server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Léon Morales" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
oabench = "oabench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oabench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# One-off Phase 1 exploration scripts, kept as a record; not part of the package.
extend-exclude = ["scripts/exploration"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
